[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
publish = false

[workspace.dependencies]
il-core = { path = "crates/il-core" }
il-sdk = { path = "crates/il-sdk" }
il-store = { path = "crates/il-store" }
il-ai = { path = "crates/il-ai" }
il-engine = { path = "crates/il-engine" }
il-nodes = { path = "crates/il-nodes" }
il-connectors = { path = "crates/il-connectors" }
il-media = { path = "crates/il-media" }
il-knowledge = { path = "crates/il-knowledge" }
il-architect = { path = "crates/il-architect" }
il-publish = { path = "crates/il-publish" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
bytes = "1"
chrono-tz = "0.10"
cron = "0.12"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
futures = "0.3"
inventory = "0.3"
mime_guess = "2"
minijinja = { version = "2", features = ["json", "loop_controls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8"
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ts-rs = { version = "10", features = ["serde-json-impl", "chrono-impl"] }
ulid = "1"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
