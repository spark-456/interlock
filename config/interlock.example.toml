# Interlock configuration. Copy to config/interlock.toml (git-ignored).
# Every module reads only its own section. Secrets NEVER go here: they come from env
# (NEBIUS_API_KEY, OPENROUTER_API_KEY, GROQ_API_KEY, TAVILY_API_KEY, IL_MASTER_KEY, GITHUB_CLIENT_SECRET, GOOGLE_CLIENT_SECRET,
# SLACK_CLIENT_SECRET, media provider keys). Env overrides: IL_HOST, IL_PORT, IL_CONFIG, IL_PROVIDERS.

[server]
host = "127.0.0.1"
port = 8080
# public_url = "https://interlock.example"   # used for OAuth callbacks, webhooks, widget URLs
cors_origins = []
# Requests without a session use the local workspace (fine self-hosted). Set false on a public deploy.
local_workspace = true
# Behind a TLS proxy (Caddy, nginx): rate limits use the client address it appends to X-Forwarded-For.
trust_proxy = false

[auth.github]
client_id = ""          # secret: GITHUB_CLIENT_SECRET

[models]
# Nebius Token Factory, OpenAI-compatible. Key: NEBIUS_API_KEY.
provider = "tokenfactory"
base_url = "https://api.tokenfactory.nebius.com/v1/"
# Role → model id, checked against `GET /v1/models` on 2026-10-30 (the server re-checks at startup).
# Nemotron-3_5-Lightning is listed but didn't answer, so `fast` uses Nano.
[models.roles]
architect = "nvidia/Nemotron-3-Ultra-550b-a55b"   # NVIDIA Nemotron 3 Ultra — goal → flow, Ask diffs
agent = "nvidia/Nemotron-3.5-Super-VL"   # NVIDIA Nemotron 3.5 Super — agents, writing
fast = "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B"   # NVIDIA Nemotron 3 Nano — classify, extract, route
embed = "Qwen/Qwen3-Embedding-8B"       # embeddings for knowledge search
# Token Factory has no speech-to-text model; Transcribe audio uses the Groq fallback.
# Retries after rate limits or provider outages (backoff doubles from backoff_ms).
# retries = 3
# backoff_ms = 500
# Extra request fields per role. Nemotron reasons at length before every reply by default, which
# makes agents and checks several times slower; the architect keeps it for planning flows.
[models.request]
agent = { chat_template_kwargs = { enable_thinking = false } }
fast = { reasoning_effort = "low" }   # with no reasoning at all it mislabels borderline messages
# USD per 1M tokens (input, output), for cost metering and caps.
[models.prices]
architect = [1.0, 3.0]
agent = [0.3, 0.9]
fast = [0.06, 0.24]
embed = [0.01, 0.0]
# Fallbacks, tried in order when Token Factory is rate-limited, down, out of credit or has no key.
# Each one starts only when its key is set; a role left out is never sent to it. Embeddings stay on
# Token Factory, because a knowledge base can't mix vectors from different embedding models.
[[models.fallbacks]]
provider = "openrouter"   # key: OPENROUTER_API_KEY. ":free" models cost nothing but are rate-limited.
roles = { architect = "nvidia/nemotron-3-ultra-550b-a55b:free", agent = "nvidia/nemotron-3.5-super-vl:free", fast = "nvidia/nemotron-3.5-lightning:free" }
[[models.fallbacks]]
provider = "groq"         # key: GROQ_API_KEY
roles = { architect = "openai/gpt-oss-120b", agent = "openai/gpt-oss-120b", fast = "openai/gpt-oss-20b", transcribe = "whisper-large-v3" }
# prices = { architect = [0.15, 0.6], agent = [0.15, 0.6], fast = [0.075, 0.3] }   # on a paid Groq plan

[providers.media]
# `recorded` returns fixture media; it is the default in demo mode, test runs and tests.
# Real adapters exist but are not live-tested; they switch on only when their key is set.
video = "recorded"
voice = "recorded"
image = "recorded"
# To use Runway, set a media kind to "runway", set RUNWAYML_API_SECRET in the
# environment, and choose models here. Video duration is 2–10 seconds.
video_model = "gen4.5"
voice_model = "eleven_multilingual_v2"
image_model = "gen4_image"

[providers.transcription]
provider = "tokenfactory"
model = ""              # set to a speech-to-text model id if available; else fake in tests

[tavily]
base_url = "https://api.tavily.com"
max_pages_per_source = 50   # key: TAVILY_API_KEY

[engine]
max_parallel = 4        # nodes running at once within a run
retries = 2             # retries for retryable node errors (backoff doubles)
retry_backoff_ms = 500
node_timeout_ms = 300000

[caps]
global_daily_usd = 25.0
workspace_daily_usd = 5.0
flow_daily_usd = 3.0
run_usd = 1.0
demo_run_usd = 0.10
demo_models = ["fast", "agent"]   # Nano/Super only in demo
demo_media = "replay"

[storage]
path = "data"           # SQLite db at data/interlock.db, files under data/files/

[security]
# master key comes ONLY from env: IL_MASTER_KEY (32 random bytes, base64)
