<div style="padding: 8px 16px 0; display: flex; flex-direction: column">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
<sc-if value="{{g.connector}}" hint-placeholder-val="{{ true }}">
<div style="height: 22px; display: flex; justify-content: center"><span style="width: 2px; height: 22px; background: {{g.line}}; border-radius: 1px"></span></div>
</sc-if>
<div style="display: flex; align-items: center; gap: 8px; padding: 6px 2px 8px; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #667085"><span style="width: 6px; height: 6px; border-radius: 2px; background: {{g.c}}"></span>{{g.t}}<span style="margin-left: auto; font-weight: 600; letter-spacing: 0; text-transform: none; color: #98A2B3">{{g.count}}</span></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{g.nodes}}" as="n" hint-placeholder-count="3">
<button type="button" aria-label="{{n.aria}}" style="position: relative; width: 100%; min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 12px; text-align: left; border-radius: 12px; background: linear-gradient(180deg, #FFFFFF 0%, #FBFCFD 100%); border: {{n.border}}; box-shadow: {{n.shadow}}; opacity: {{n.op}}; box-sizing: border-box; font-family: inherit; color: inherit; cursor: pointer">
<sc-if value="{{n.building}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 12px; right: 12px; top: -1px; height: 3px; border-radius: 0 0 3px 3px; background: #D3ECE9; overflow: hidden"><span style="display: block; width: 70%; height: 3px; background: #0B7A72"></span></span></sc-if>

<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 14px; line-height: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.title}}</span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 17px; color: #667085; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.sub}}</span>
</span>
<span style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 999px; background: {{n.pbg}}; color: {{n.pfg}}; font-size: 12px; font-weight: 600; white-space: nowrap">
<sc-if value="{{n.spin}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="#B9DEDA" stroke-width="1.75"></circle><path d="M6 1.5a4.5 4.5 0 0 1 4.5 4.5" fill="none" stroke="#0B7A72" stroke-width="1.75" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 6 6" to="360 6 6" dur="0.9s" repeatCount="indefinite"></animateTransform></path></svg></sc-if>
<sc-if value="{{n.dot}}" hint-placeholder-val="{{ true }}"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{n.dc}}"></span></sc-if>
{{n.pill}}</span>
</button>
</sc-for>
</div>
</sc-for>
</div>

<div style="padding: 20px 16px 0">
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px"><span style="font-size: 15px; font-weight: 700">Build log</span><span style="font-size: 12px; color: #667085">Latest</span></div>
<div style="padding: 12px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E4E7EC; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{log}}" as="l" hint-placeholder-count="4">
<div style="display: flex; gap: 10px; font-size: 13px; line-height: 19px">
<span style="flex: 0 0 34px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #98A2B3">{{l.t}}</span>
<span style="color: {{l.c}}; font-weight: {{l.w}}">{{l.x}}</span>

<button type="button" style="height: 100%; min-height: 52px; border-radius: 10px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #344054; font: 600 14px 'Plus Jakarta Sans', sans-serif; cursor: pointer">Cancel build</button>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1745}}'>
class Component extends DCLogic {
  renderVals() {
    const cat = {
      source: ['#EFF8FF', '#1570EF', '#D1E9FF'], kb: ['#F4F3FF', '#6938EF', '#E0DCFD'], router: ['#F0F9FF', '#026AA2', '#CCE9F7'],
      agent: ['#E7F5F3', '#0B7A72', '#C4E6E2'], tool: ['#FFFAEB', '#B54708', '#FEE9B8'], guard: ['#FFF1F3', '#C01048', '#FFD5DC'],
      tests: ['#ECFDF3', '#067647', '#C6F0D8'], output: ['#EEF4FF', '#3538CD', '#D6E0FD']
    };
    const P = {
      ready: ['Ready', '#ECFDF3', '#067647', '#17B26A'],
      waiting: ['Waiting', '#F2F4F7', '#475467', '#98A2B3'],
      building: ['Building', '#E7F5F3', '#0B7A72', ''],
      skipped: ['8 skipped', '#FFFAEB', '#B54708', '#F79009']
    };
    const G = [
      ['Inputs', '#1570EF', [
        ['help.larkspur.example', '42 pages · 18 s', 'source', 'globe', 'ready'],
        ['4 documents', '4 files · 22 pages', 'source', 'docs', 'ready'],
        ['Larkspur Admin API', '11 endpoints · using 3', 'source', 'plug', 'skipped']]],
      ['Understanding', '#6938EF', [
        ['Larkspur knowledge', '1,284 chunks · hybrid', 'kb', 'db', 'ready'],
        ['Admin API tools', '3 tools · GET GET POST', 'tool', 'wrench', 'ready'],
        ['Request router', 'Billing · Support', 'router', 'split', 'ready']]],
      ['Agents', '#0B7A72', [
        ['Support agent', '640 words · 1 tool', 'agent', 'agent', 'ready'],
        ['Billing agent', '710 words · 3 tools', 'agent', 'agent', 'ready'],
        ['30 tests', '21 / 30 run · 19 passed', 'tests', 'tests', 'building']]],
      ['Safety', '#C01048', [
        ['Safety rules', '4 rules · refunds over $100', 'guard', 'shield', 'ready']]],
      ['Outputs', '#3538CD', [
        ['API', 'OpenAI-compatible', 'output', 'api', 'waiting'],
        ['MCP server', '4 tools', 'output', 'mcp', 'waiting'],
        ['Chat widget', '1 script tag', 'output', 'chat', 'waiting']]]
    ];
    const groups = G.map((g, gi) => {
      const nodes = g[2].map((n) => {
        const c = cat[n[2]], p = P[n[4]];
        const q = n[4] === 'waiting';
        return {
          title: n[0], sub: n[1], icon: n[3], tile: c[0], ink: c[1], edge: c[2],
          pill: p[0], pbg: p[1], pfg: p[2], dc: p[3], dot: !!p[3], spin: n[4] === 'building', building: n[4] === 'building',
          border: q ? '1px dashed #D0D5DD' : (n[4] === 'building' ? '1.5px solid #0B7A72' : '1px solid #E4E7EC'),
          shadow: q ? 'none' : (n[4] === 'building' ? '0 0 0 3px rgba(11,122,114,0.12), 0 4px 0 -1px #C4E6E2, 0 14px 24px -12px rgba(11,122,114,0.35)' : 'inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(16,24,40,0.06), 0 3px 0 -1px #DDE2E8, 0 12px 20px -12px rgba(16,24,40,0.22)'),
          op: q ? 0.6 : 1,
          aria: n[0] + ', ' + p[0] + '. Open details'
        };
      });
      const allReady = g[2].every((n) => n[4] === 'ready' || n[4] === 'skipped');
      return { t: g[0], c: g[1], nodes, connector: gi > 0, line: gi <= 3 ? '#B4BCC8' : '#D0D5DD', count: allReady ? 'Ready' : (g[0] === 'Outputs' ? 'Next' : 'In progress') };
    });
    const L = [
      ['1:05', 'Writing system prompts: Support (640 words), Billing (710 words)'],
      ['1:12', 'Adding 4 guardrails'],
      ['1:18', 'Generating 30 tests from your documents and API'],
      ['1:28', 'Running tests: 21 of 30 done, 19 passed so far']
    ];
    const log = L.map((l, i) => ({ t: l[0], x: l[1], c: i === L.length - 1 ? '#0B7A72' : '#344054', w: i === L.length - 1 ? 600 : 400 }));
    return { groups, log };
  }
}
</script>
