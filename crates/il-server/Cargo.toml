[package]
name = "il-server"
description = "The Interlock binary: axum app, auth, route mounting, SSE, embedded web build, wiring."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
il-core.workspace = true
# testkit gives the fake services used until B01/B02/B03 land (and for IL_PROVIDERS=fake).
il-sdk = { workspace = true, features = ["testkit"] }
il-store.workspace = true
il-ai.workspace = true
il-engine.workspace = true
il-nodes.workspace = true
il-connectors.workspace = true
il-media.workspace = true
il-knowledge.workspace = true
il-architect.workspace = true
il-publish.workspace = true

anyhow.workspace = true
futures.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["tokio", "http1", "json", "query", "macros", "multipart"] }
mime_guess.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
url.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tower.workspace = true
wiremock.workspace = true
tempfile = "3"
